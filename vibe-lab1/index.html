<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教务器材预约</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="page-shell">
        <p class="eyebrow">课程作业演示</p>
        <h1>教务器材预约</h1>
        <p class="intro">选择需要的教学设备，预约合适的日期与时间段。</p>
      </div>
    </header>

    <main class="page-shell">
      <section class="notice-panel" aria-live="polite">
        <span class="notice-icon">✓</span>
        <div>
          <strong>本地预约提示</strong>
          <p>预约数据仅保存在当前浏览器中，适合课程演示使用。</p>
        </div>
      </section>

      <section>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Equipment list</p>
            <h2>可预约器材</h2>
          </div>
          <span class="section-count">共 3 件</span>
        </div>
        <div id="page-message" class="page-message" role="status" aria-live="polite"></div>
        <div id="equipment-list" class="equipment-grid"></div>
      </section>
    </main>

    <dialog id="booking-dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Make a booking</p>
          <h2 id="dialog-title">预约器材</h2>
        </div>
        <button class="icon-button" type="button" data-close-dialog aria-label="关闭预约窗口">×</button>
      </div>

      <form id="booking-form">
        <input id="equipment-id" name="equipmentId" type="hidden">
        <p id="selected-equipment" class="selected-equipment"></p>

        <label for="booking-date">预约日期</label>
        <input id="booking-date" name="date" type="date" required>

        <label for="time-slot">时间段</label>
        <select id="time-slot" name="timeSlot" required>
          <option value="">请选择时间段</option>
          <option value="09:00-11:00">09:00 - 11:00</option>
          <option value="14:00-16:00">14:00 - 16:00</option>
          <option value="16:00-18:00">16:00 - 18:00</option>
        </select>

        <p id="booking-message" class="form-message" role="alert" aria-live="assertive"></p>

        <div class="form-actions">
          <button class="button button-secondary" type="button" data-close-dialog>取消</button>
          <button class="button button-primary" type="submit">确认预约</button>
        </div>
      </form>
    </dialog>

    <script src="booking.js"></script>
    <script src="app.js"></script>
  </body>
</html>
