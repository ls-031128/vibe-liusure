services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pet-health-platform:production
    # Runtime injection only; this file is ignored by both Git and Docker builds.
    # Keep the local SQLite archive .env separate from this production file.
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:3000"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
