name: CI tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pet-health-platform
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          # Prisma's existing config validates DIRECT_URL while generating the client.
          # This local placeholder is not contacted and does not point to Neon.
          DIRECT_URL: postgresql://127.0.0.1:5432/prisma_generate

      - name: Run tests
        run: npm test
